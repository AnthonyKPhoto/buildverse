services:
  buildverse:
    image: ghcr.io/anthonykphoto/buildverse:latest
    # build: .   # uncomment to build locally instead of pulling from GHCR
    ports:
      - "3456:3000"
    volumes:
      - buildverse-data:/data
    environment:
      - DATABASE_URL=file:/data/buildverse.db

      # ── Server mode ──────────────────────────────────────────────────────────────
      # Setting AUTH_SESSION_SECRET turns on login for everyone except local
      # connections (127.0.0.1, ::1 — the Electron window talking to its own
      # spawned server, which always bypasses it). Any long random string.
      # Generate with:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - AUTH_SESSION_SECRET=

      # ── Bootstrap admin account (optional) ───────────────────────────────────────
      # Leave both blank and the first person to visit the site gets a
      # "create the admin account" form instead — simplest for a fresh deploy.
      # Set these only if you want a specific admin pre-provisioned before
      # anyone visits. Everyone else (including additional admins) is created
      # afterward from Settings → Users by an admin.
      - ADMIN_USERNAME=admin
      # Generate with: node scripts/hash-password.js "your-password"
      - ADMIN_PASSWORD_HASH=

    restart: unless-stopped

  # ── Watchtower: auto-update BuildVerse when a new image is published ──────────
  # Checks GHCR once per hour and recreates the container if a new image exists.
  # Remove this service if you prefer to update manually.
  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: buildverse --interval 3600 --cleanup
    restart: unless-stopped

volumes:
  buildverse-data:
