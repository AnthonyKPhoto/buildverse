name: Feature request
description: Suggest an idea for Upshift Garage
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or workflow, not just the solution.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you do today instead?
