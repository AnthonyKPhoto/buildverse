# ─────────────────────────────────────────────────────────────────────────────
# Upshift Garage — Release Workflow
#
# Triggers when you push a version tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Produces (attached to one GitHub Release):
#   • UpshiftGarage-Setup-X.X.X.exe            Windows installer (recommended)
#   • UpshiftGarage-X.X.X-Portable.exe          Windows portable, no install needed
#   • UpshiftGarage-X.X.X-mac-arm64.dmg / .zip  macOS, Apple Silicon
#   • UpshiftGarage-X.X.X-mac-x64.dmg / .zip    macOS, Intel
#   • UpshiftGarage-X.X.X.AppImage              Linux, self-contained
#   • upshift-garage_X.X.X_amd64.deb            Linux, Debian/Ubuntu
# (The Docker image is published by docker-publish.yml, triggered by the same tag.)
#
# The release page text is composed ONCE, in the Windows job, from RELEASE_NOTES.md plus a download table.
# The Linux and macOS jobs run after it (needs:) and only upload files — never touch the body — because
# several jobs appending to one release description at the same time would overwrite each other.
# ─────────────────────────────────────────────────────────────────────────────

name: Build & Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  # Manual run ("Run workflow" button, or the API): releases the version given, from `main`. It creates the
  # vX.Y.Z tag at that commit itself when the release is created, so no git tag push is needed. Used when
  # a tag can't be pushed from where you are. Refuses to run from any other branch, and refuses a version
  # that doesn't match package.json.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 1.15.0) — must match package.json"
        required: true
        type: string

permissions:
  contents: write   # required to create releases and upload assets

jobs:
  release:
    name: Package Windows installer
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    # prisma/schema.prisma reads its datasource from DATABASE_URL (needed for
    # Docker's sake — see CLAUDE.md). A relative file: URL resolves relative
    # to prisma/schema.prisma's own directory, so this points at the same
    # prisma/dev.db that electron-builder.yml bundles into the installer as
    # the template database.
    env:
      DATABASE_URL: "file:./dev.db"

    steps:
      # ── 1. Source ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ────────────────────────────────────────────────────────
      # Node 22, not 20 — undici@8.9.0 (used by src/lib/scraper.ts) requires
      # Node >=22.19.0; `next build`'s page-data collection actually executes
      # that import chain and crashes on Node 20.
      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # ── 3. Cache Electron & electron-builder downloads ───────────────────
      - name: Validate release version
        shell: bash
        env:
          VER_INPUT: ${{ inputs.version }}
        run: |
          ver="${VER_INPUT:-${GITHUB_REF_NAME#v}}"
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::'$ver' is not a version like 1.2.3"; exit 1; fi
          pkg=$(grep -m1 '"version"' package.json | sed 's/.*: *"\(.*\)".*/\1/')
          if [ "$pkg" != "$ver" ]; then echo "::error::Releasing $ver but package.json says $pkg — bump the version first"; exit 1; fi
          echo "Releasing v$ver (package.json matches)"

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-win-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-win-

      # ── 4. Dependencies ───────────────────────────────────────────────────
      # ELECTRON_SKIP_BINARY_DOWNLOAD=1 skips the Electron postinstall download;
      # electron-builder fetches its own copy during packaging anyway.
      - name: Install npm dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      # ── 5. Database (template bundled inside the installer) ────────────────
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create database schema
        run: npx prisma db push

      - name: Seed demo data
        run: npx prisma db seed

      # ── 6. Next.js build (standalone output) ─────────────────────────────
      - name: Build Next.js application
        run: npx next build

      # ── 7. Electron packaging ─────────────────────────────────────────────
      - name: Bundle Electron main process
        run: npx esbuild electron/main.js --bundle --platform=node --external:electron --outfile=electron/main.bundled.js

      # Bundles a real node.exe into resources-extra/ so the packaged app
      # never depends on the end user having Node.js installed — see
      # scripts/fetch-node-runtime.js.
      - name: Fetch Node.js runtime for bundling
        run: npm run fetch-node-runtime

      - name: Package Windows installer
        run: npx electron-builder --win --publish never

      - name: Verify Node.js runtime was bundled
        shell: pwsh
        run: |
          $nodePath = "dist-electron/win-unpacked/resources/node.exe"
          if (!(Test-Path $nodePath)) { throw "node.exe missing from packaged resources — the app would depend on the user's own Node.js install" }
          Write-Host "Bundled $nodePath ($((Get-Item $nodePath).Length) bytes)"

      # ── 8. Create GitHub Release and upload artifacts ─────────────────────
      - name: Get version
        id: version
        shell: bash
        env:
          VER_INPUT: ${{ inputs.version }}
        run: echo "ver=${VER_INPUT:-${GITHUB_REF_NAME#v}}" >> "$GITHUB_OUTPUT"

      - name: Compose release notes
        shell: bash
        env:
          VER: ${{ steps.version.outputs.ver }}
        run: |
          {
            cat RELEASE_NOTES.md
            cat <<EOF

          ---

          ## Download

          | Platform | File |
          |---|---|
          | **Windows** | \`UpshiftGarage-Setup-${VER}.exe\` (installer, recommended) · \`UpshiftGarage-${VER}-Portable.exe\` (no install) |
          | **macOS — Apple Silicon** (M1 and newer) | \`UpshiftGarage-${VER}-mac-arm64.dmg\` |
          | **macOS — Intel** | \`UpshiftGarage-${VER}-mac-x64.dmg\` |
          | **Linux** | \`UpshiftGarage-${VER}.AppImage\` · \`upshift-garage_${VER}_amd64.deb\` |
          | **Docker / self-hosted** | \`ghcr.io/anthonykphoto/buildverse:${VER}\` (or \`:latest\`) |

          **No prerequisites** — Node.js, the browser engine and everything else are bundled in each desktop download.

          ### First launch

          - **Windows** — SmartScreen may warn because the app isn't code-signed yet: **More info → Run anyway**.
          - **macOS — easiest:** install with Homebrew, which skips the "unidentified developer" block: \`brew tap AnthonyKPhoto/buildverse https://github.com/AnthonyKPhoto/buildverse && brew install --cask upshift-garage\`. Or download the \`.dmg\` — the app isn't notarized (no Apple Developer account yet). Open the \`.dmg\`, drag **Upshift Garage** into Applications, then open it once; if macOS blocks it, go to **System Settings → Privacy & Security → Open Anyway**. Or run: \`xattr -cr "/Applications/Upshift Garage.app"\`. macOS builds don't auto-update — the app tells you when a new release is out.
          - **Linux** — AppImage: \`chmod +x UpshiftGarage-${VER}.AppImage && ./UpshiftGarage-${VER}.AppImage\`. Debian/Ubuntu: \`sudo apt install ./upshift-garage_${VER}_amd64.deb\`. Needs a glibc-based 64-bit distro (not Alpine).
          - **Docker** — see the [self-hosting guide](https://github.com/${GITHUB_REPOSITORY}#self-hosting-with-docker).

          ### Where your data lives

          | Install | Location |
          |---|---|
          | Windows | \`%APPDATA%\\BuildVerse\\\` |
          | macOS | \`~/Library/Application Support/BuildVerse/\` |
          | Linux | \`~/.config/BuildVerse/\` |
          | Docker | the \`/data\` volume |

          The folder keeps its original "BuildVerse" name on purpose, so installing this version over an older one never loses anything.
          EOF
          } > release-body.md
          echo "--- release-body.md ---"; cat release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Upshift Garage v${{ steps.version.outputs.ver }}"
          tag_name: v${{ steps.version.outputs.ver }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          body_path: release-body.md
          files: |
            dist-electron/*.exe
            dist-electron/latest.yml

  release-linux:
    name: Package Linux AppImage + deb
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    # Runs after the Windows job so it appends to the release that job
    # creates, instead of both jobs racing to create it at the same time.
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: "file:./dev.db"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Cache Electron & electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-linux-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-linux-

      - name: Install npm dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create database schema
        run: npx prisma db push

      - name: Seed demo data
        run: npx prisma db seed

      - name: Build Next.js application
        run: npx next build

      - name: Bundle Electron main process
        run: npx esbuild electron/main.js --bundle --platform=node --external:electron --outfile=electron/main.bundled.js

      # Bundles a real `node` binary into resources-extra/ so the packaged
      # app never depends on the end user having Node.js installed — see
      # scripts/fetch-node-runtime.js.
      - name: Fetch Node.js runtime for bundling
        run: npm run fetch-node-runtime

      - name: Package Linux AppImage + deb
        run: npx electron-builder --linux --publish never

      - name: Verify Node.js runtime was bundled
        run: |
          NODE_PATH="dist-electron/linux-unpacked/resources/node"
          if [ ! -f "$NODE_PATH" ]; then
            echo "node binary missing from packaged resources — the app would depend on the user's own Node.js install"
            exit 1
          fi
          echo "Bundled $NODE_PATH ($(stat -c%s "$NODE_PATH") bytes)"

      - name: Get version
        id: version
        env:
          VER_INPUT: ${{ inputs.version }}
        run: echo "ver=${VER_INPUT:-${GITHUB_REF_NAME#v}}" >> "$GITHUB_OUTPUT"

      - name: Upload Linux artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          name: "Upshift Garage v${{ steps.version.outputs.ver }}"
          tag_name: v${{ steps.version.outputs.ver }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/latest-linux.yml

  release-mac:
    name: Package macOS (${{ matrix.arch }})
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    needs: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest   # Apple Silicon
          - arch: x64
            runner: macos-15-intel # Intel (macos-13 was retired by GitHub)
    env:
      DATABASE_URL: "file:./dev.db"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create database schema
        run: npx prisma db push

      - name: Seed demo data
        run: npx prisma db seed

      - name: Build Next.js application
        run: npx next build

      - name: Bundle Electron main process
        run: npx esbuild electron/main.js --bundle --platform=node --external:electron --outfile=electron/main.bundled.js

      - name: Fetch Node.js runtime for bundling
        run: npm run fetch-node-runtime

      - name: Package macOS app
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Verify Node.js runtime was bundled
        run: |
          NODE_PATH=$(ls -d dist-electron/mac*/"Upshift Garage.app"/Contents/Resources/node | head -1)
          if [ ! -f "$NODE_PATH" ]; then
            echo "node binary missing from packaged resources"
            exit 1
          fi
          echo "Bundled $NODE_PATH"

      - name: Get version
        id: version
        env:
          VER_INPUT: ${{ inputs.version }}
        run: echo "ver=${VER_INPUT:-${GITHUB_REF_NAME#v}}" >> "$GITHUB_OUTPUT"

      - name: Upload macOS artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          name: "Upshift Garage v${{ steps.version.outputs.ver }}"
          tag_name: v${{ steps.version.outputs.ver }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            dist-electron/*.dmg
            dist-electron/*.zip


  # ── Homebrew cask ────────────────────────────────────────────────────────────
  # Once both macOS builds are attached to the release, rewrite Casks/upshift-garage.rb with the new
  # version and the SHA-256 of each DMG, and commit it to main so `brew upgrade --cask upshift-garage` sees it.
  update-cask:
    name: Update Homebrew cask
    needs: release-mac
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Get version
        id: version
        env:
          VER_INPUT: ${{ inputs.version }}
        run: echo "ver=${VER_INPUT:-${GITHUB_REF_NAME#v}}" >> "$GITHUB_OUTPUT"

      - name: Hash the DMGs and write the cask
        env:
          VER: ${{ steps.version.outputs.ver }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for a in arm64 x64; do
            gh release download "v${VER}" --repo "${GITHUB_REPOSITORY}" --pattern "UpshiftGarage-${VER}-mac-${a}.dmg" --dir dmgs
          done
          ARM=$(sha256sum "dmgs/UpshiftGarage-${VER}-mac-arm64.dmg" | cut -d' ' -f1)
          X64=$(sha256sum "dmgs/UpshiftGarage-${VER}-mac-x64.dmg" | cut -d' ' -f1)
          node scripts/update-cask.js "$VER" "$ARM" "$X64"

      - name: Commit the cask
        env:
          VER: ${{ steps.version.outputs.ver }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/upshift-garage.rb
          git diff --cached --quiet && { echo "cask already up to date"; exit 0; }
          git commit -m "chore(brew): cask → ${VER}"
          git push origin HEAD:main
