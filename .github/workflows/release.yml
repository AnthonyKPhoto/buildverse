# ─────────────────────────────────────────────────────────────────────────────
# BuildVerse — Release Workflow
#
# Triggers when you push a version tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Produces:
#   • BuildVerse Setup X.X.X.exe    — Windows NSIS installer (recommended)
#   • BuildVerse X.X.X Portable.exe — Windows portable, no install needed
#   • BuildVerse-X.X.X.AppImage     — Linux, self-contained, no install needed
#   • buildverse_X.X.X_amd64.deb    — Linux, Debian/Ubuntu package
#
# The Linux job runs after (needs:) the Windows job so it appends its
# artifacts to the same GitHub Release instead of racing to create it.
# ─────────────────────────────────────────────────────────────────────────────

name: Build & Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write   # required to create releases and upload assets

jobs:
  release:
    name: Package Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    # prisma/schema.prisma reads its datasource from DATABASE_URL (needed for
    # Docker's sake — see CLAUDE.md). A relative file: URL resolves relative
    # to prisma/schema.prisma's own directory, so this points at the same
    # prisma/dev.db that electron-builder.yml bundles into the installer as
    # the template database.
    env:
      DATABASE_URL: "file:./dev.db"

    steps:
      # ── 1. Source ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ────────────────────────────────────────────────────────
      # Node 22, not 20 — undici@8.9.0 (used by src/lib/scraper.ts) requires
      # Node >=22.19.0; `next build`'s page-data collection actually executes
      # that import chain and crashes on Node 20.
      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # ── 3. Cache Electron & electron-builder downloads ───────────────────
      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-win-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-win-

      # ── 4. Dependencies ───────────────────────────────────────────────────
      # ELECTRON_SKIP_BINARY_DOWNLOAD=1 skips the Electron postinstall download;
      # electron-builder fetches its own copy during packaging anyway.
      - name: Install npm dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      # ── 5. Database (template bundled inside the installer) ────────────────
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create database schema
        run: npx prisma db push

      - name: Seed demo data
        run: npx prisma db seed

      # ── 6. Next.js build (standalone output) ─────────────────────────────
      - name: Build Next.js application
        run: npx next build

      # ── 7. Electron packaging ─────────────────────────────────────────────
      - name: Bundle Electron main process
        run: npx esbuild electron/main.js --bundle --platform=node --external:electron --outfile=electron/main.bundled.js

      # Bundles a real node.exe into resources-extra/ so the packaged app
      # never depends on the end user having Node.js installed — see
      # scripts/fetch-node-runtime.js.
      - name: Fetch Node.js runtime for bundling
        run: npm run fetch-node-runtime

      - name: Package Windows installer
        run: npx electron-builder --win --publish never

      - name: Verify Node.js runtime was bundled
        shell: pwsh
        run: |
          $nodePath = "dist-electron/win-unpacked/resources/node.exe"
          if (!(Test-Path $nodePath)) { throw "node.exe missing from packaged resources — the app would depend on the user's own Node.js install" }
          Write-Host "Bundled $nodePath ($((Get-Item $nodePath).Length) bytes)"

      # ── 8. Create GitHub Release and upload artifacts ─────────────────────
      - name: Get version from tag
        id: version
        shell: bash
        run: echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "BuildVerse v${{ steps.version.outputs.ver }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist-electron/*.exe
            dist-electron/latest.yml
          body: |
            ## BuildVerse v${{ steps.version.outputs.ver }}

            ### Download

            | File | Description |
            |------|-------------|
            | `BuildVerse Setup ${{ steps.version.outputs.ver }}.exe` | **Installer (recommended)** — installs to your user profile, creates Desktop + Start Menu shortcuts |
            | `BuildVerse ${{ steps.version.outputs.ver }} Portable.exe` | **Portable** — run from any folder, no install needed |

            ---

            ### How to install

            1. Click the installer `.exe` above to download it
            2. Double-click the file — Windows may show a blue SmartScreen warning
               > Click **"More info"** → **"Run anyway"**
               > *(This appears because the app is not yet code-signed. It is safe.)*
            3. Follow the wizard: **Next → Next → Install → Finish**
            4. Launch **BuildVerse** from the Desktop shortcut or Start Menu

            ---

            ### What's included

            - **No prerequisites** — Node.js, Chromium, and all dependencies are bundled inside the installer
            - Demo garage included: 2002 Honda S2000 AP1
            - Your data is stored at `%APPDATA%\BuildVerse\buildverse.db` and is **never touched by updates**
            - Auto-updates: the installed app will detect and download this release automatically
            - Runs in the background — close the window to minimise to the system tray

            ### System requirements
            - Windows 10 / 11 (64-bit)
            - No other software required

  release-linux:
    name: Package Linux AppImage + deb
    # Runs after the Windows job so it appends to the release that job
    # creates, instead of both jobs racing to create it at the same time.
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: "file:./dev.db"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Cache Electron & electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-linux-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-linux-

      - name: Install npm dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create database schema
        run: npx prisma db push

      - name: Seed demo data
        run: npx prisma db seed

      - name: Build Next.js application
        run: npx next build

      - name: Bundle Electron main process
        run: npx esbuild electron/main.js --bundle --platform=node --external:electron --outfile=electron/main.bundled.js

      # Bundles a real `node` binary into resources-extra/ so the packaged
      # app never depends on the end user having Node.js installed — see
      # scripts/fetch-node-runtime.js.
      - name: Fetch Node.js runtime for bundling
        run: npm run fetch-node-runtime

      - name: Package Linux AppImage + deb
        run: npx electron-builder --linux --publish never

      - name: Verify Node.js runtime was bundled
        run: |
          NODE_PATH="dist-electron/linux-unpacked/resources/node"
          if [ ! -f "$NODE_PATH" ]; then
            echo "node binary missing from packaged resources — the app would depend on the user's own Node.js install"
            exit 1
          fi
          echo "Bundled $NODE_PATH ($(stat -c%s "$NODE_PATH") bytes)"

      - name: Get version from tag
        id: version
        run: echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Upload Linux artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          name: "BuildVerse v${{ steps.version.outputs.ver }}"
          draft: false
          prerelease: false
          append_body: true
          fail_on_unmatched_files: false
          files: |
            dist-electron/*.AppImage
            dist-electron/*.deb
          body: |
            ---

            ### Linux

            | File | Description |
            |------|-------------|
            | `BuildVerse-${{ steps.version.outputs.ver }}.AppImage` | **AppImage (recommended)** — download, `chmod +x`, then run. No install needed |
            | `buildverse_${{ steps.version.outputs.ver }}_amd64.deb` | **Debian/Ubuntu package** — `sudo apt install ./buildverse_${{ steps.version.outputs.ver }}_amd64.deb` |

            **No prerequisites** — Node.js and all dependencies are bundled inside the package.

            Your data is stored at `~/.config/BuildVerse/buildverse.db` and is never touched by updates.

            ### System requirements
            - 64-bit Linux, glibc-based (Ubuntu, Debian, Fedora, etc. — not Alpine)
            - No other software required
